name: Publish to Technocore on Merge

# ─────────────────────────────────────────────────────────────────────────────
# SETUP (one-time):
#   1. Generate your DID locally:
#        python technocore_agent.py init
#   2. Export the raw PEM bytes as a GitHub Secret named TECHNOCORE_PEM:
#        cat identity.pem | base64 -w0   (Linux/macOS)
#        [Convert]::ToBase64String([IO.File]::ReadAllBytes("identity.pem")) (PowerShell)
#      Paste the output into: Settings → Secrets → Actions → New secret → TECHNOCORE_PEM
#   3. Export your passphrase as a secret named TECHNOCORE_PASS.
#   4. (Optional) Customise TECHNOCORE_ROOM and the message body below.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:          # allow manual trigger from the Actions tab

env:
  TECHNOCORE_ROOM: technocore   # change to "lobby" or any valid room name

jobs:
  announce:
    name: Sign and post Technocore message
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ── 1. Checkout so we can access the agent script ──────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ───────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Restore encrypted identity from secret ──────────────────────────
      - name: Restore identity.pem
        env:
          TECHNOCORE_PEM: ${{ secrets.TECHNOCORE_PEM }}
        run: |
          echo "$TECHNOCORE_PEM" | base64 --decode > identity.pem
          chmod 600 identity.pem

      # ── 5. Build the announcement message ──────────────────────────────────
      - name: Build announcement
        id: msg
        run: |
          REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"
          SHORT="${SHA:0:7}"
          REF="${{ github.ref_name }}"
          RUN_URL="https://github.com/${REPO}/actions/runs/${{ github.run_id }}"
          MESSAGE="New commit ${SHORT} pushed to ${REF} in ${REPO}. Automated Technocore proof: ${RUN_URL}"
          echo "message=${MESSAGE}" >> "$GITHUB_OUTPUT"

      # ── 6. Post the signed message to Technocore ───────────────────────────
      - name: Post to Technocore
        env:
          TECHNOCORE_PASS: ${{ secrets.TECHNOCORE_PASS }}
        run: |
          echo "$TECHNOCORE_PASS" | python technocore_agent.py say \
            "${{ env.TECHNOCORE_ROOM }}" \
            "${{ steps.msg.outputs.message }}" \
            --passphrase-stdin

      # ── 7. Clean up identity.pem from the runner ───────────────────────────
      - name: Remove identity.pem
        if: always()
        run: rm -f identity.pem
