name: Technocore Auto Runner — $FLOP Airdrop

on:
  schedule:
    # Random-ish: jalan tiap jam tapi di menit ke 7, 23, 41, 57
    # (tidak tepat jam, lebih natural)
    - cron: '7 */3 * * *'    # tiap 3 jam di menit ke-7
    - cron: '23 1-23/4 * * *' # tiap 4 jam di menit ke-23
  workflow_dispatch:
    # Bisa juga dijalankan manual dari GitHub

jobs:
  post-message:
    name: Post Signed Message to Technocore
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install cryptography==50.0.0

      - name: Random human-like delay
        run: |
          DELAY=$((RANDOM % 300 + 30))
          echo "Waiting ${DELAY}s before posting (human-like timing)..."
          sleep $DELAY

      - name: Restore identity.pem from secret
        run: |
          echo "${{ secrets.IDENTITY_PEM_B64 }}" | base64 -d > identity.pem
          chmod 600 identity.pem
          echo "identity.pem restored ($(wc -c < identity.pem) bytes)"

      - name: Post message to Technocore
        env:
          TECHNOCORE_PASS: ${{ secrets.TECHNOCORE_PASS }}
          PYTHONIOENCODING: utf-8
        run: |
          python auto_runner.py --once --room lobby

      - name: Show log
        if: always()
        run: cat auto_runner.log 2>/dev/null || echo "No log file"
