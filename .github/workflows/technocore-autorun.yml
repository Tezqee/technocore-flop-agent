name: Technocore Auto Runner — Multi Room

on:
  schedule:
    # lobby     → tiap 3 jam di menit ke-17
    - cron: '17 */3 * * *'
    # technocore → tiap 6 jam di menit ke-43
    - cron: '43 */6 * * *'
    # developers → tiap 12 jam di menit ke-31
    - cron: '31 */12 * * *'
  workflow_dispatch:
    # Trigger manual → jalankan semua 3 room sekaligus

jobs:
  # ── Job 1: lobby (tiap 3 jam + manual) ─────────────────────────────────────
  post-lobby:
    name: Post to lobby
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install cryptography==50.0.0
      - name: Random delay
        run: sleep $((RANDOM % 180 + 10))
      - name: Restore identity.pem
        run: |
          echo "${{ secrets.IDENTITY_PEM_B64 }}" | base64 -d > identity.pem
          chmod 600 identity.pem
      - name: Post to lobby
        env:
          TECHNOCORE_PASS: ${{ secrets.TECHNOCORE_PASS }}
          PYTHONIOENCODING: utf-8
        run: python auto_runner.py --once --room lobby
      - name: Show log
        if: always()
        run: cat auto_runner.log 2>/dev/null || echo "No log"
      - name: Cleanup
        if: always()
        run: rm -f identity.pem

  # ── Job 2: technocore (tiap 6 jam + manual) ────────────────────────────────
  post-technocore:
    name: Post to technocore
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check schedule
        id: check
        run: |
          MINUTE=$(date -u +%-M)
          # Menit 40-46 = jadwal technocore (cron '43 */6')
          # Atau manual trigger = selalu jalan
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          elif [ "$MINUTE" -ge 40 ] && [ "$MINUTE" -le 46 ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/checkout@v4.2.2
        if: steps.check.outputs.run == 'true'
      - uses: actions/setup-python@v5.3.0
        if: steps.check.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        if: steps.check.outputs.run == 'true'
        run: pip install cryptography==50.0.0
      - name: Random delay
        if: steps.check.outputs.run == 'true'
        run: sleep $((RANDOM % 120 + 30))
      - name: Restore identity.pem
        if: steps.check.outputs.run == 'true'
        run: |
          echo "${{ secrets.IDENTITY_PEM_B64 }}" | base64 -d > identity.pem
          chmod 600 identity.pem
      - name: Post to technocore
        if: steps.check.outputs.run == 'true'
        env:
          TECHNOCORE_PASS: ${{ secrets.TECHNOCORE_PASS }}
          PYTHONIOENCODING: utf-8
        run: python auto_runner.py --once --room technocore
      - name: Show log
        if: always()
        run: cat auto_runner.log 2>/dev/null || echo "No log"
      - name: Cleanup
        if: always()
        run: rm -f identity.pem

  # ── Job 3: developers (tiap 12 jam + manual) ───────────────────────────────
  post-developers:
    name: Post to developers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check schedule
        id: check
        run: |
          MINUTE=$(date -u +%-M)
          # Menit 28-34 = jadwal developers (cron '31 */12')
          # Atau manual trigger = selalu jalan
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          elif [ "$MINUTE" -ge 28 ] && [ "$MINUTE" -le 34 ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/checkout@v4.2.2
        if: steps.check.outputs.run == 'true'
      - uses: actions/setup-python@v5.3.0
        if: steps.check.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        if: steps.check.outputs.run == 'true'
        run: pip install cryptography==50.0.0
      - name: Random delay
        if: steps.check.outputs.run == 'true'
        run: sleep $((RANDOM % 90 + 15))
      - name: Restore identity.pem
        if: steps.check.outputs.run == 'true'
        run: |
          echo "${{ secrets.IDENTITY_PEM_B64 }}" | base64 -d > identity.pem
          chmod 600 identity.pem
      - name: Post to developers
        if: steps.check.outputs.run == 'true'
        env:
          TECHNOCORE_PASS: ${{ secrets.TECHNOCORE_PASS }}
          PYTHONIOENCODING: utf-8
        run: python auto_runner.py --once --room developers
      - name: Show log
        if: always()
        run: cat auto_runner.log 2>/dev/null || echo "No log"
      - name: Cleanup
        if: always()
        run: rm -f identity.pem
